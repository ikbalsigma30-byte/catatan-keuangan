<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lupa Password</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><section class="hero"><div class="auth-logo-image"><img src="logo-catatan-keuangan.png" alt="Logo Catatan Keuangan"></div><h1>Lupa Password</h1><p>Verifikasi keamanan diperlukan sebelum password dapat diubah.</p><div id="forgotStep1" class="security-card"><label>Username</label><input id="forgotUser" placeholder="Masukkan username" autocomplete="username"><button class="btn" type="button" onclick="startPasswordRecovery()">Lanjut Verifikasi</button></div><div id="forgotStep2" class="security-card" style="display:none"><div class="verify-badge">🔐 Verifikasi Keamanan</div><label>Pertanyaan Keamanan</label><div id="forgotQuestion" class="security-question">-</div><label>Jawaban Keamanan</label><input id="forgotAnswer" placeholder="Masukkan jawaban" autocomplete="off"><label>PIN Keamanan</label><input id="forgotPin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6 angka" autocomplete="off"><button class="btn" type="button" onclick="verifyPasswordRecovery()">Verifikasi</button></div><div id="forgotStep3" class="security-card" style="display:none"><div class="verify-badge success">✓ Verifikasi Berhasil</div><label>Password Baru</label><input id="newPassword" type="password" placeholder="Password baru" autocomplete="new-password"><label>Konfirmasi Password</label><input id="confirmPassword" type="password" placeholder="Ulangi password baru" autocomplete="new-password"><button class="btn" type="button" onclick="resetPassword()">Simpan Password Baru</button></div><p class="center"><a class="link" href="login.html">Kembali ke Login</a></p></section></main><script src="app.js"></script></body></html>
