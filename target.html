<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Target</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><div class="header"><a class="back" href="profil.html">‹</a><b>Tambah Target</b></div><div class="card"><h2 style="font-size:18px;margin:4px 0">Atur target pengeluaran harianmu</h2><p class="note">Agar lebih disiplin</p><label>Nominal Target</label><input id="targetAmount" type="number" min="0" placeholder="Masukkan target"><label>Pilih Kategori</label><select id="targetCat"><option>Semua Kategori</option><option>Makanan</option><option>Transportasi</option><option>Belanja</option><option>Pendidikan</option><option>Hiburan</option><option>Lainnya</option></select><label>Deskripsi (Opsional)</label><textarea id="targetDesc" placeholder="Tambahkan keterangan"></textarea><button class="btn" onclick="saveTarget()">Simpan</button></div></main><script src="app.js"></script></body></html>
