<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Akun</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><section class="hero"><div class="auth-logo-image"><img src="logo-catatan-keuangan.png" alt="Logo Catatan Keuangan"></div><h1>Daftar Akun</h1><p>Buat akun baru untuk mulai mengelola keuanganmu</p><form class="auth-form" onsubmit="event.preventDefault();register()"><label>Nama Lengkap</label><input id="regName" placeholder="Nama Lengkap"><label>Username</label><input id="regUser" placeholder="Username"><label>Email</label><input id="regEmail" type="email" placeholder="Email"><label>Password</label><input id="regPass" type="password" placeholder="Password"><label>Pertanyaan Keamanan</label><select id="regQuestion"><option value="">Pilih pertanyaan keamanan</option><option value="nama_ibu">Siapa nama ibu kamu?</option><option value="kota_lahir">Di kota mana kamu lahir?</option><option value="nama_sekolah">Apa nama sekolah kamu?</option><option value="hewan_favorit">Apa hewan favorit kamu?</option></select><label>Jawaban Keamanan</label><input id="regAnswer" placeholder="Jawaban keamanan" autocomplete="off"><label>PIN Keamanan (6 angka)</label><input id="regPin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Contoh: 123456" autocomplete="off"><small class="auth-help">Data keamanan ini diperlukan untuk verifikasi saat lupa password.</small><button class="btn" type="submit">Daftar</button></form><p class="center">Sudah punya akun? <a class="link" href="login.html">Login</a></p></section></main><script src="app.js"></script></body></html>
