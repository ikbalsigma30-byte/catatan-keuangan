<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Pengeluaran</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><div class="header"><div><a class="back" href="beranda.html">‹</a><b>Tambah Pengeluaran</b></div></div><form class="form" onsubmit="event.preventDefault();addTransaction()"><label>Nominal</label><input id="amount" type="number" min="1" inputmode="numeric" placeholder="Masukkan nominal"><label>Nama Pengeluaran</label><input id="name" placeholder="Contoh: Makan siang"><label>Kategori</label><div class="categories"><div class="cat active" data-cat="Makanan" onclick="selectCat(this)"><span>🍴</span>Makanan</div><div class="cat" data-cat="Transportasi" onclick="selectCat(this)"><span>🚕</span>Transportasi</div><div class="cat" data-cat="Belanja" onclick="selectCat(this)"><span>🛍️</span>Belanja</div><div class="cat" data-cat="Pendidikan" onclick="selectCat(this)"><span>📚</span>Pendidikan</div><div class="cat" data-cat="Hiburan" onclick="selectCat(this)"><span>🎮</span>Hiburan</div><div class="cat" data-cat="Lainnya" onclick="selectCat(this)"><span>•••</span>Lainnya</div></div><input id="category" type="hidden" value="Makanan"><label>Tanggal</label><input id="date" type="date"><label>Catatan (Opsional)</label><textarea id="note" placeholder="Tambahkan catatan jika perlu"></textarea><button class="btn" type="submit">Simpan Pengeluaran</button></form></main><script>document.getElementById('date').value=(()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})()</script><script src="app.js"></script></body></html>
