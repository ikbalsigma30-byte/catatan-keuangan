<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifikasi Pengingat</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><div class="header"><a class="back" href="profil.html">‹</a><b>Notifikasi Pengingat</b></div><div class="hero compact"><div class="logo notification-bell" aria-label="Lonceng notifikasi">🔔</div><h2>Pengingat Pengeluaran</h2><p>Kamu bisa mengatur pengingat sesuai kebutuhan.</p></div><div class="card"><div class="switch-line">Pengingat Batas Harian <span class="switch" data-notif="limit" onclick="toggleNotif(this,'limit')"><i></i></span></div><div class="switch-line">Pengingat Transaksi <span class="switch" data-notif="transaction" onclick="toggleNotif(this,'transaction')"><i></i></span></div><div class="switch-line">Notifikasi Harian <span class="switch" data-notif="daily" onclick="toggleNotif(this,'daily')"><i></i></span></div><div class="menu">Waktu Notifikasi <span class="right"><input id="notifTime" type="time" value="08:00" onchange="saveNotifTime(this.value)" style="width:auto;padding:5px;border:0">›</span></div><button class="btn" type="button" onclick="requestAlarmPermission()">Aktifkan Alarm</button></div></main><script src="app.js"></script></body></html>
